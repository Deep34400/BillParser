services:
  api:
    build: { context: ., dockerfile: platform/Dockerfile }
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-billparser-dev}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-billparser-uploads}
      FIRESTORE_PREFIX: ${FIRESTORE_PREFIX:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PORT: 4000
      NODE_ENV: production
    ports: [ "4000:4000" ]
  web:
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: [ api ]
    ports: [ "8081:80" ]
